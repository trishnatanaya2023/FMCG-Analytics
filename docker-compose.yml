services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: distribusense
      POSTGRES_USER: distribusense
      POSTGRES_PASSWORD: distribusense_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
